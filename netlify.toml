# ============================================================
# إعدادات Netlify لمتجر امباير
#
# هذا الملف يحدد جدولة الملخص اليومي فقط. إعدادات النشر (مجلد
# الموقع وأمر البناء) تبقى كما هي بلوحة تحكم Netlify.
# ============================================================

# الملخص اليومي على تيليجرام — الساعة ١٩:٠٠ بتوقيت UTC
# أي الساعة ١٠ مساءً بتوقيت بغداد (UTC+3)
[functions."daily-summary"]
  schedule = "0 19 * * *"

# ============================================================
# منع المتصفح من تقديم نسخة قديمة من الصفحات
#
# صفحتا الموقع ولوحة التحكم كلاهما ملف واحد يحوي الكود كاملاً،
# فأي نسخة مخزّنة بذاكرة المتصفح تعني إن صاحب المتجر أو الزبون
# يشتغل على إصدار قديم بعد النشر. صار هذا فعلاً مع لوحة التحكم
# لمّا فُتحت كتطبيق مثبّت على شاشة الآيفون: خزّنت النسخة القديمة
# وما تأثرت بتحديث الصفحة.
#
# no-cache لا تعني "لا تخزّن" — تعني "اسأل الخادم قبل الاستعمال".
# فالصفحة تبقى سريعة إذا ما تغيّرت، وتتحدث فوراً إذا تغيّرت.
# ============================================================
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
